{% extends 'base.html' %}
{% block content %}
<h1>Новый пароль</h1>
{% if validlink %}<form class="panel form" method="post">{% csrf_token %}{{ form.as_p }}<button>Сохранить пароль</button></form>
{% else %}<p>Ссылка уже использована или срок действия истёк.</p><a href="{% url 'password_reset' %}">Запросить новую ссылку</a>{% endif %}
{% endblock %}
